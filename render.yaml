services:
  - type: web
    name: abr-margin-processor
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MIRROR_URL
        value: "https://yppxtnrpvxeqmdqzsrnj.supabase.co/functions/v1/ingestao-sheets"
      - key: MIRROR_TOKEN
        sync: false
      - key: MIRROR_TOKEN_LOCATION
        value: "body"
      - key: MIRROR_TOKEN_FIELD
        value: "token"
      - key: MIRROR_BATCH_SIZE
        value: "500"
